<title>Coordenades dels establiments - Cornellà</title>
<!-- Si unpkg no respon, el full d'estil es torna a demanar a jsDelivr (vegeu
     la nota del leaflet.js, mes avall). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: Segoe UI, Arial, sans-serif; color: #1a1a1a; }
  /* Columna: capçalera, mapa i barra. El mapa ocupa EL QUE QUEDI: abans era
     'calc(100vh - 116px)', i amb una barra de dues linies la pagina feia scroll. */
  body { display: flex; flex-direction: column; height: 100vh; }
  #top { background: #14365c; color: #fff; padding: 10px 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  #top h1 { font-size: 18px; margin: 0; }
  #top .meta { font-size: 13px; opacity: .9; }
  #wrap { display: flex; flex: 1 1 auto; min-height: 0; }
  #map { flex: 1 1 auto; }
  #side { width: 380px; overflow: auto; border-left: 1px solid #ddd; padding: 0 0 30px 0; }
  #side h2 { font-size: 14px; margin: 12px 14px 6px; }
  #cerca { width: calc(100% - 28px); margin: 0 14px 8px; padding: 6px 8px; font-size: 13px;
           border: 1px solid #ccd2da; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #f3f5f8; position: sticky; top: 0; z-index: 2; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f7fafd; }
  tr.moguda td.id { font-weight: bold; color: #a0560b; }
  tr.revisada { background: #f2f7f4; }
  tr.revisada td.id::before { content: '\2713 '; color: #14365c; font-weight: bold; }
  td.id { font-family: Consolas, monospace; color: #14365c; white-space: nowrap; }
  td.dist { text-align: right; white-space: nowrap; color: #555; }
  .pin { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .pin-fac { background: #2ecc71; border: 1px solid #145a32; }
  .pin-dub { background: #f1c40f; border: 1px solid #7d6608; }
  .pin-apr { background: #a9dfbf; border: 1px solid #145a32; }
  .pin-cad { background: #fff;    border: 2px solid #145a32; width: 7px; height: 7px; }
  .pin-man { background: #e67e22; border: 1px solid #7e5109; }
  .pin-rev { background: #fff; border: 2px solid #14365c; }
  .pin-red { background: #c0392b; }
  /* JA CORREGIDA: l'Excel ja no te la coordenada al punt del Cadastre. */
  .pin-cor { background: #8e44ad; border: 1px solid #5b2c6f; }
  .pin-pcad { background: #fff; border: 1px solid #555; width: 6px; height: 6px; }
  tr.corregida td.id { color: #8e44ad; font-weight: bold; }
  .pop .cor, .targeta .tt-cor { color: #6c3483; font-weight: bold; }
  #llegenda b { color: #14365c; }
  #llegenda { font-size: 12px; color: #444; margin: 4px 14px 10px; line-height: 1.7; }
  #llegenda .n { color: #14365c; font-weight: bold; }
  #llegenda .tecles { color: #777; }
  #filtreEstat { width: calc(100% - 28px); margin: 0 14px 6px; padding: 5px 6px; font-size: 13px;
                 border: 1px solid #ccd2da; border-radius: 4px; background: #fff; }
  /* La parella seleccionada (fila, punt verd i vermell, i la linia que els uneix). */
  tr.sel td { background: #fff4d6; }
  button:disabled { opacity: .45; cursor: default; }
  #bar { padding: 8px 16px; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #14365c; color: #fff; border: 0; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4d82; }
  button.sec { background: #fff; color: #14365c; border: 1px solid #c3ccd8; }
  button.sec:hover { background: #eef3f9; }
  #estat { font-size: 12px; color: #555; }
  /* El COLOR diu d'on surt el punt; el CONTORN GRUIXUT, que ja l'has repassat. */
  .marker-verd { width: 14px; height: 14px; border-radius: 50%; background: #2ecc71;
                 border: 2px solid #145a32; box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: move; }
  .marker-verd.dubtosa     { background: #f1c40f; border-color: #7d6608; }
  .marker-verd.aprox       { background: #a9dfbf; border-color: #145a32; }
  .marker-verd.sensefacana { background: #fff;    border-color: #145a32; }
  .marker-verd.moguda      { background: #e67e22; border-color: #7e5109; }
  /* JA CORREGIDA i encara on la va deixar la correccio (lila), o tornada al punt
     de la parcel.la al Cadastre (blanc amb vora grisa). */
  .marker-verd.corregida   { background: #8e44ad; border-color: #5b2c6f; }
  .marker-verd.parcela     { background: #fff;    border-color: #555; }
  .marker-verd.revisada    { box-shadow: 0 0 0 3px #14365c, 0 1px 3px rgba(0,0,0,.45); }
  .marker-verd.sel         { transform: scale(1.45); outline: 3px solid #f39c12; outline-offset: 3px; }
  /* PER REVISAR: un "!" a la cantonada del punt i un \26A0 a la fila. */
  .marker-verd { position: relative; }
  .marker-verd.avis::after { content: '!'; position: absolute; top: -10px; right: -10px; width: 13px; height: 13px;
                             border-radius: 50%; background: #c0392b; color: #fff; border: 1px solid #fff;
                             font: bold 10px/13px Segoe UI, Arial, sans-serif; text-align: center; }
  tr.avis td.id::before { content: '\26A0\00A0'; color: #c0392b; }
  .pin-avis { background: #c0392b; border-radius: 50%; width: 11px; height: 11px; color: #fff; text-align: center;
              font: bold 9px/11px Segoe UI, Arial, sans-serif; vertical-align: 0; }
  .pin-avis::after { content: '!'; }
  .pop .avis-pop { margin-top: 6px; padding-top: 5px; border-top: 1px solid #eee; font-size: 12px; }
  .pop .avis-pop .nota { color: #a04000; }
  /* La targeta en passar el ratoli per sobre d'un punt. */
  .leaflet-tooltip.targeta { font-size: 12px; line-height: 1.4; width: max-content; min-width: 200px; max-width: 320px; white-space: normal; }
  .targeta .tt-gris { color: #666; }
  .targeta .tt-avis { color: #c0392b; font-weight: bold; }
  /* Numeros de portal del Cadastre: nomes a partir del zoom de carrer. */
  .portal-num { white-space: nowrap; font-size: 11px; color: #34495e; font-weight: bold;
                text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
                pointer-events: none; }
  .portal-num i { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
                  background: #34495e; margin-right: 3px; vertical-align: 1px; }
  .pop h3 { margin: 0 0 4px; font-size: 14px; color: #14365c; }
  .pop .rc { font-family: Consolas, monospace; font-size: 11px; color: #666; }
  .pop table { font-size: 12px; margin-top: 6px; }
  .pop td { border: 0; padding: 1px 6px 1px 0; }
  .pop .org { margin-top: 5px; font-size: 12px; }
  /* TRIAR LES ZONES AL PLANOL: la graella de 400 m i el quadre de dalt. */
  .zona-etq { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
              font: 12px/1.25 Segoe UI, Arial, sans-serif; color: #14365c; pointer-events: none;
              text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }
  .zona-etq b { font-size: 14px; }
  .zona-etq.activa { color: #0b2a4a; }
  #triaCtl { background: #fff; padding: 8px 12px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.35);
             font-size: 13px; max-width: 330px; line-height: 1.45; }
  #triaCtl button { margin-top: 6px; padding: 5px 14px; font-size: 13px; }
  .pop .accions { margin-top: 6px; padding-top: 5px; border-top: 1px solid #eee; font-size: 12px; line-height: 1.7; }
  /* El titular: al popup i, mes petit, sota l'adreca a la llista. */
  .tit { font-size: 11px; color: #555; }
  .pop .tit { font-size: 12px; color: #333; }
</style>

<script>

<script>
// ---------------------------------------------------------------------------
// PROJECCIO: lat/lon (WGS84) -> UTM fus 31N (ETRS89, EPSG:25831).
// El Leaflet ens dona graus quan s'arrossega un punt, i nosaltres hem
// d'exportar metres. Es la inversa exacta de Convert-UtmToLatLon (Ruta.ps1);
// comprovada d'anada i tornada sobre tot el terme municipal, error < 0,1 mm.
// ---------------------------------------------------------------------------
function latLonToUtm31(lat, lon) {
  var a = 6378137.0, f = 1.0 / 298.257223563, k0 = 0.9996;
  var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  var rad = Math.PI / 180;
  var phi = lat * rad, lam = lon * rad;
  var lam0 = (31 * 6 - 183) * rad;
  var sinP = Math.sin(phi), cosP = Math.cos(phi), tanP = Math.tan(phi);
  var N = a / Math.sqrt(1 - e2 * sinP * sinP);
  var T = tanP * tanP;
  var C = ep2 * cosP * cosP;
  var A = (lam - lam0) * cosP;
  var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * phi
    - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * phi)
    + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * phi)
    - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * phi));
  var x = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6
    + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000.0;
  var y = k0 * (M + N * tanP * (A * A / 2
    + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24
    + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  return [x, y];
}

// INVERSA: UTM fus 31N -> lat/lon. Es Convert-UtmToLatLon (Ruta.ps1) passada a
// JavaScript formula per formula. Cal per CARREGAR un repas des de l'Excel, que
// nomes porta metres. La suite del navegador en comprova l'anada i tornada.
function utm31ToLatLon(easting, northing) {
  var a = 6378137.0, f = 1.0 / 298.257223563, k0 = 0.9996;
  var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  var x = easting - 500000.0, y = northing;
  var mu = (y / k0) / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256));
  var e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  var phi1 = mu
    + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
    + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
    + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu)
    + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);
  var sinP = Math.sin(phi1), cosP = Math.cos(phi1), tanP = Math.tan(phi1);
  var C1 = ep2 * cosP * cosP, T1 = tanP * tanP;
  var N1 = a / Math.sqrt(1 - e2 * sinP * sinP);
  var R1 = a * (1 - e2) / Math.pow(1 - e2 * sinP * sinP, 1.5);
  var D = x / (N1 * k0);
  var lat = phi1 - (N1 * tanP / R1) * (D * D / 2
    - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24
    + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
  var lon0 = (31 * 6 - 183) * Math.PI / 180;
  var lon = lon0 + (D - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
    + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / cosP;
  return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}

function distanciaUtm(x1, y1, x2, y2) {
  var dx = x1 - x2, dy = y1 - y2;
  return Math.sqrt(dx * dx + dy * dy);
}

function escHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ---------------------------------------------------------------------------
// ESCRIPTOR DE .xlsx (sense cap biblioteca).
// Un .xlsx es un ZIP amb cinc XML a dins. Amb el metode "sense compressio"
// nomes cal el CRC-32 i les capçaleres del ZIP, i surt un fitxer que l'Excel
// obre amb doble clic i sense cap avis de format.
// ---------------------------------------------------------------------------
var CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) { c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function utf8(str) { return new TextEncoder().encode(str); }

function escXml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    // Els caracters de control no son legals en XML 1.0 i farien il-legible el
    // fitxer. No n'hi hauria d'haver, pero les dades venen del GIA.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}

// Nom de columna d'Excel: 1 -> A, 27 -> AA.
function colName(n) {
  var s = '';
  while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// ZIP amb metode 0 (sense comprimir). Retorna Uint8Array.
function zipStore(files) {
  var chunks = [], central = [], offset = 0;
  function u16(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; }
  function u32(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }
  for (var i = 0; i < files.length; i++) {
    var name = utf8(files[i].name);
    var data = files[i].data;
    var crc = crc32(data);
    // Data/hora fixes (1980-01-01): el mateix contingut dona sempre el mateix
    // fitxer, cosa que fa que es pugui comparar byte a byte a les proves.
    var lfh = [].concat(
      u32(0x04034B50), u16(20), u16(0x0800), u16(0), u16(0), u16(33),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    chunks.push(new Uint8Array(lfh), name, data);
    central.push({ name: name, crc: crc, size: data.length, offset: offset });
    offset += lfh.length + name.length + data.length;
  }
  var cdChunks = [], cdSize = 0;
  for (var j = 0; j < central.length; j++) {
    var e = central[j];
    var cdh = [].concat(
      u32(0x02014B50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(33),
      u32(e.crc), u32(e.size), u32(e.size), u16(e.name.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(e.offset));
    cdChunks.push(new Uint8Array(cdh), e.name);
    cdSize += cdh.length + e.name.length;
  }
  cdChunks.push(new Uint8Array([].concat(
    u32(0x06054B50), u16(0), u16(0), u16(central.length), u16(central.length),
    u32(cdSize), u32(offset), u16(0))));
  var all = chunks.concat(cdChunks), total = 0;
  for (var k = 0; k < all.length; k++) { total += all[k].length; }
  var out = new Uint8Array(total), p = 0;
  for (var m = 0; m < all.length; m++) { out.set(all[m], p); p += all[m].length; }
  return out;
}

// header: array de textos. rows: array d'arrays; els numbers van com a numero
// i la resta com a text inline (aixi no cal sharedStrings.xml).
function buildXlsx(sheetName, header, rows) {
  function cellsOf(vals, rowNum) {
    var s = '';
    for (var c = 0; c < vals.length; c++) {
      var ref = colName(c + 1) + rowNum, v = vals[c];
      if (typeof v === 'number' && isFinite(v)) {
        s += '<c r="' + ref + '"><v>' + v + '</v></c>';
      } else if (v !== null && v !== undefined && v !== '') {
        s += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + escXml(v) + '</t></is></c>';
      }
    }
    return '<row r="' + rowNum + '">' + s + '</row>';
  }
  var sd = cellsOf(header, 1);
  for (var r = 0; r < rows.length; r++) { sd += cellsOf(rows[r], r + 2); }

  // Amplades de columna, perque el fitxer s'obri llegible i no s'hagin
  // d'eixamplar a ma cada vegada.
  var widths = [10, 24, 40, 8, 15, 15, 15, 15, 40, 14, 28];
  var cols = '<cols>';
  for (var w = 0; w < header.length; w++) {
    cols += '<col min="' + (w + 1) + '" max="' + (w + 1) + '" width="' + (widths[w] || 14) + '" customWidth="1"/>';
  }
  cols += '</cols>';

  var decl = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  var parts = [
    { name: '[Content_Types].xml', text: decl +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>' },
    { name: '_rels/.rels', text: decl +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>' },
    { name: 'xl/workbook.xml', text: decl +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + escXml(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', text: decl +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>' },
    { name: 'xl/styles.xml', text: decl +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>' +
      '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
      '<borders count="1"><border/></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>' },
    { name: 'xl/worksheets/sheet1.xml', text: decl +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      cols + '<sheetData>' + sd + '</sheetData></worksheet>' }
  ];
  return zipStore(parts.map(function (p) { return { name: p.name, data: utf8(p.text) }; }));
}

// ---------------------------------------------------------------------------
// LECTOR DE .xlsx, per CARREGAR un repas. Ha d'entendre dos fitxers:
//   - el que et baixes d'aquest mapa (ZIP sense comprimir, textos inline);
//   - el MATEIX fitxer un cop obert i desat amb l'Excel, que el torna a escriure
//     comprimit (deflate) i amb els textos a xl/sharedStrings.xml.
// El deflate el descomprimeix el mateix Chrome (DecompressionStream), sense cap
// biblioteca. Torna una promesa amb les files de la PRIMERA fulla (arrays).
// ---------------------------------------------------------------------------
function u16le(b, p) { return b[p] | (b[p + 1] << 8); }
function u32le(b, p) { return (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0; }

function llegeixZip(bytes) {
  // El final del directori central es busca des del final: hi pot haver un
  // comentari darrere (fins a 64 KB).
  var eocd = -1;
  for (var p = bytes.length - 22; p >= Math.max(0, bytes.length - 65557); p--) {
    if (u32le(bytes, p) === 0x06054B50) { eocd = p; break; }
  }
  if (eocd < 0) { throw new Error('no és un fitxer .xlsx'); }
  var n = u16le(bytes, eocd + 10), q = u32le(bytes, eocd + 16), entrades = {};
  for (var k = 0; k < n; k++) {
    if (u32le(bytes, q) !== 0x02014B50) { throw new Error('el fitxer .xlsx està malmès'); }
    var metode = u16le(bytes, q + 10), mida = u32le(bytes, q + 20);
    var lNom = u16le(bytes, q + 28), lExtra = u16le(bytes, q + 30), lCom = u16le(bytes, q + 32);
    var off = u32le(bytes, q + 42);
    var nom = new TextDecoder().decode(bytes.subarray(q + 46, q + 46 + lNom));
    // Les dades comencen despres de la capçalera LOCAL, que te els seus propis
    // camps de nom i extra (no han de coincidir amb els del directori central).
    var ini = off + 30 + u16le(bytes, off + 26) + u16le(bytes, off + 28);
    entrades[nom] = { metode: metode, dades: bytes.subarray(ini, ini + mida) };
    q += 46 + lNom + lExtra + lCom;
  }
  return entrades;
}

function textEntrada(entrades, nom) {
  var e = entrades[nom];
  if (!e) { return Promise.resolve(null); }
  if (e.metode === 0) { return Promise.resolve(new TextDecoder().decode(e.dades)); }
  if (e.metode === 8) {
    return new Response(new Blob([e.dades]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  return Promise.reject(new Error('el .xlsx fa servir una compressió desconeguda (' + e.metode + ')'));
}

// Per NOM LOCAL, sense lligar-se a cap espai de noms (com el parseig del
// Cadastre a Geocodificador.ps1): cada programa que desa un .xlsx els prefixa
// a la seva manera.
function perNom(node, nom) { return node.getElementsByTagNameNS('*', nom); }
function textDe(node) {
  var ts = perNom(node, 't'), s = '';
  for (var i = 0; i < ts.length; i++) { s += ts[i].textContent; }
  return s;
}

function llegeixXlsx(buffer) {
  var entrades = llegeixZip(new Uint8Array(buffer));
  function xml(t) { return t ? new DOMParser().parseFromString(t, 'application/xml') : null; }
  return Promise.all([textEntrada(entrades, 'xl/workbook.xml'),
                      textEntrada(entrades, 'xl/_rels/workbook.xml.rels'),
                      textEntrada(entrades, 'xl/sharedStrings.xml')]).then(function (t) {
    // La primera fulla del LLIBRE: l'Excel pot haver canviat el nom del fitxer intern.
    var fulla = 'xl/worksheets/sheet1.xml';
    var wb = xml(t[0]), rels = xml(t[1]);
    if (wb && rels && perNom(wb, 'sheet').length > 0) {
      var s0 = perNom(wb, 'sheet')[0];
      var rid = s0.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      var rs = perNom(rels, 'Relationship');
      for (var i = 0; i < rs.length; i++) {
        if (rs[i].getAttribute('Id') !== rid) { continue; }
        var dest = rs[i].getAttribute('Target');
        fulla = dest.charAt(0) === '/' ? dest.substring(1) : 'xl/' + dest;
      }
    }
    var compartits = [], ss = xml(t[2]);
    if (ss) {
      var sis = perNom(ss, 'si');
      for (var j = 0; j < sis.length; j++) { compartits.push(textDe(sis[j])); }
    }
    return textEntrada(entrades, fulla).then(function (tf) {
      var doc = xml(tf);
      if (!doc) { throw new Error('el fitxer no té cap full de càlcul'); }
      var files = [], rows = perNom(doc, 'row');
      for (var r = 0; r < rows.length; r++) {
        var fila = [], cs = perNom(rows[r], 'c');
        for (var c = 0; c < cs.length; c++) {
          // La columna surt de la referencia (B2 -> 1): l'Excel no escriu les
          // cel·les buides i, sense aixo, tot es desplaçaria.
          var ref = cs[c].getAttribute('r') || '', col = 0;
          for (var x = 0; x < ref.length && ref.charCodeAt(x) >= 65; x++) { col = col * 26 + ref.charCodeAt(x) - 64; }
          col = col > 0 ? col - 1 : fila.length;
          var tipus = cs[c].getAttribute('t'), v = perNom(cs[c], 'v')[0], val;
          if (tipus === 'inlineStr')   { val = textDe(cs[c]); }
          else if (!v)                 { val = ''; }
          else if (tipus === 's')      { val = compartits[parseInt(v.textContent, 10)] || ''; }
          else if (tipus === 'str' || tipus === 'b' || tipus === 'e') { val = v.textContent; }
          else                         { val = parseFloat(v.textContent); }
          fila[col] = val;
        }
        files.push(fila);
      }
      return files;
    });
  });
}

// ---------------------------------------------------------------------------
// ESTAT DE CADA ACTIVITAT
//   origen:   d'on surt el punt verd -- 'facana' | 'facana-dubtosa' |
//             'facana-aprox' | 'cadastre' | 'manual' (l'has mogut tu) |
//             'excel' (JA CORREGIDA: comenca on l'Excel la te ara) |
//             'parcela' (l'has tornada al punt de la parcel.la al Cadastre)
//   revisada: ja l'has donada per bona
//
// estat[] va per POSICIO dins d'ITEMS, no per ID: si algun dia la base portes
// dos cops el mateix ID Activitat, dues fitxes es trepitjarien. Al navegador,
// en canvi, es desa per ID -- que es el que ha de sobreviure quan es torni a
// generar el mapa d'una altra zona.
// ---------------------------------------------------------------------------
var estat = [];

function llegeixDesat() {
  try {
    var cru = window.localStorage.getItem(CLAU);
    return cru ? (JSON.parse(cru) || {}) : {};
  } catch (e) { return {}; }   // localStorage desactivat: no es cap drama
}

function escriuDesat(d) {
  try { window.localStorage.setItem(CLAU, JSON.stringify(d)); } catch (e) { }
}

function r2(v) { return Math.round(v * 100) / 100; }

// ---------------------------------------------------------------------------
// PER REVISAR (octubre 2026, l'usuari: "hi ha punts estranys. Vull poder posar
// un warning per revisar posteriorment"). Un avis amb una nota opcional, A PART
// del repas: marcar-lo no valida ni mou el punt, i l'«Excel per importar» no
// el toca mai (no porta coordenada nova). Viu al navegador amb la seva clau, i
// va a l'Excel del repas (columna «Per revisar») perque la copia de seguretat
// el porti; «Carregar repas» el recupera.
// ---------------------------------------------------------------------------
var CLAU_AVIS = 'coordenades-avisos:' + FONT;
var avisos = {};

function llegeixAvisos() {
  try {
    var cru = window.localStorage.getItem(CLAU_AVIS);
    var o = cru ? JSON.parse(cru) : {};
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}

function escriuAvisos(a) {
  try { window.localStorage.setItem(CLAU_AVIS, JSON.stringify(a)); } catch (e) { }
}

function teAvis(i) { return avisos.hasOwnProperty(ITEMS[i].id); }

function posaAvis(i, nota) {
  var it = ITEMS[i];
  avisos = llegeixAvisos();
  avisos[it.id] = { nota: String(nota || '').trim(), rc: it.rc, adreca: it.adreca, zona: it.zona, xe: it.xe, ye: it.ye };
  escriuAvisos(avisos);
  refrescaObert(i);
  actualitzaEstatBarra();
}

function treuAvis(i) {
  avisos = llegeixAvisos();
  delete avisos[ITEMS[i].id];
  escriuAvisos(avisos);
  refrescaObert(i);
  actualitzaEstatBarra();
}

// Com refrescaItem, pero la fitxa que tenies oberta es queda oberta (amb l'avis
// nou): el setIcon del Leaflet torna a lligar el popup i el tanca.
function refrescaObert(i) {
  var obert = capes[i].verd.isPopupOpen();
  refrescaItem(i);
  if (obert) { capes[i].verd.openPopup(); }
}

// Des de la fitxa del punt: la nota es pregunta (i es pot deixar en blanc).
function marcaAvis(i) {
  var nota = window.prompt('Per revisar: què hi has vist? (opcional)', teAvis(i) ? avisos[ITEMS[i].id].nota : '');
  if (nota === null) { return; }
  posaAvis(i, nota);
}

// On comenca el punt que es mou si encara no l'has tocat. Una JA CORREGIDA
// (l'Excel ja no es al punt del Cadastre) comenca ON ES ARA, i no al portal:
// l'usuari (octubre 2026) la veia lila a l'Excel i alhora en verd al portal, i
// per tornar-la a tocar havia de partir del portal en lloc de la seva correccio.
function estatInicial(i) {
  var it = ITEMS[i];
  if (it.cor) { return { lat: it.late, lon: it.lone, origen: 'excel', revisada: false }; }
  return { lat: it.latf, lon: it.lonf, origen: it.prec, revisada: false };
}

function carregaCorreccions() {
  var desat = llegeixDesat();
  avisos = llegeixAvisos();
  for (var i = 0; i < ITEMS.length; i++) {
    var it = ITEMS[i];
    var d = desat[it.id];
    if (d && isFinite(d.lat) && isFinite(d.lon)) {
      // Les versions velles nomes desaven lat/lon: es donen per mogudes a ma.
      estat[i] = { lat: d.lat, lon: d.lon, origen: d.origen || 'manual', revisada: true };
    } else {
      estat[i] = estatInicial(i);
    }
  }
}

// Desa (o treu) una activitat del navegador. Es desa la FILA SENCERA i no
// nomes la posicio, perque l'Excel ha de poder portar tot el que has repassat
// d'aquesta base -- tambe el de les zones que avui no tens obertes.
function desaItem(i) {
  var it = ITEMS[i], e = estat[i];
  var desat = llegeixDesat();
  if (e.revisada) {
    var u = utmActual(i);
    desat[it.id] = {
      lat: e.lat, lon: e.lon, origen: e.origen,
      x: r2(u[0]), y: r2(u[1]), xe: it.xe, ye: it.ye,
      rc: it.rc, adreca: it.adreca, zona: it.zona
    };
  } else {
    delete desat[it.id];
  }
  escriuDesat(desat);
}

function comptaRevisades() {
  var n = 0;
  for (var i = 0; i < estat.length; i++) { if (estat[i].revisada) n++; }
  return n;
}

function textOrigen(o) {
  if (o === 'facana')         return 'portal amb el número exacte';
  if (o === 'facana-dubtosa') return 'portal DUBTÓS: n\'hi havia més d\'un amb aquell número';
  if (o === 'facana-aprox')   return 'aquell número no hi era: el portal més proper de la parcel·la';
  if (o === 'manual')         return 'mogut per tu';
  if (o === 'excel')          return 'ja corregida: on la té ara l\'Excel';
  if (o === 'parcela')        return 'tornada al punt de la parcel·la (Cadastre)';
  return 'sense portal: es queda al centre de la parcel·la';
}

// Coordenada UTM actual del punt verd. Si no s'ha mogut a ma, tornem els metres
// TAL COM van arribar (del Cadastre o de l'Excel) en lloc de reprojectar-los:
// aixi no s'hi acumula l'error d'anar i tornar de graus.
function utmActual(i) {
  var it = ITEMS[i], e = estat[i];
  if (e.origen === 'manual') { return latLonToUtm31(e.lat, e.lon); }
  if (e.origen === 'excel') { return [it.xe, it.ye]; }
  if (e.origen === 'parcela' && esNum(it.xc) && esNum(it.yc)) { return [it.xc, it.yc]; }
  return [it.xf, it.yf];
}

// ---------------------------------------------------------------------------
// MAPA
// ---------------------------------------------------------------------------
// preferCanvas: amb centenars d'activitats, dibuixar els cercles i les linies
// al canvas en lloc de fer-ne SVG es la diferencia entre un mapa fluid i un
// mapa que va a batzegades.
if (typeof L === 'undefined') { throw new Error('Leaflet no carregat: el mapa no pot arrencar.'); }
// maxZoom 22 (abans 19): l'usuari, "deixa'm fer mes zoom que sino estan molt
// lluny". Les rajoles del fons arriben fins al 18 i, d'alli en amunt,
// s'amplien (maxNativeZoom, MapaFons.js): es veuen mes grosses, no en blanc.
var map = L.map('map', { preferCanvas: true, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 120, maxZoom: 22 });
// El fons: MapaFons.js (comu als mapes de rutes/). OpenStreetMap ja no serveix
// les rajoles a una pagina oberta des del disc.
var FONS = afegeixFonsMapa(map);
// El planol del Cadastre (MapaFons.js): la casella de la barra i el selector.
lligaCasellaCadastre(map, FONS, 'chkCadastre');

var capes = [];   // per posicio: { verd, vermell, linia, fila }
var bounds = [];

function classeVerd(i) {
  var e = estat[i];
  var c = 'marker-verd';
  if (e.origen === 'manual')             { c += ' moguda'; }
  else if (e.origen === 'facana-dubtosa'){ c += ' dubtosa'; }
  else if (e.origen === 'facana-aprox')  { c += ' aprox'; }
  else if (e.origen === 'cadastre')      { c += ' sensefacana'; }
  else if (e.origen === 'excel')         { c += ' corregida'; }
  else if (e.origen === 'parcela')       { c += ' parcela'; }
  if (e.revisada) { c += ' revisada'; }
  if (teAvis(i))  { c += ' avis'; }
  if (i === sel)  { c += ' sel'; }
  return c;
}

function classeFila(i) {
  var e = estat[i];
  return (e.revisada ? 'revisada' : '') + (e.origen === 'manual' ? ' moguda' : '') + (teAvis(i) ? ' avis' : '') +
         (ITEMS[i].cor ? ' corregida' : '') + (i === sel ? ' sel' : '');
}

function iconaVerd(i) {
  return L.divIcon({ className: '', html: '<div class="' + classeVerd(i) + '"></div>',
                     iconSize: [14, 14], iconAnchor: [7, 7] });
}

function popupHtml(i) {
  var it = ITEMS[i], e = estat[i];
  var utm = utmActual(i);
  var d = distanciaUtm(it.xe, it.ye, utm[0], utm[1]);
  return '<div class="pop">' +
    '<h3>ID ' + escHtml(it.id) + (it.zona ? ' &middot; zona ' + escHtml(it.zona) : '') + '</h3>' +
    '<div>' + escHtml(it.activitat || '(activitat no especificada)') + '</div>' +
    (it.titular || it.adt ? '<div class="tit">Titular: <b>' + escHtml(it.titular || '(sense nom)') + '</b>' +
      (it.adt ? '<br>Adreça del titular: ' + escHtml(it.adt) : '') + '</div>' : '') +
    '<div>' + escHtml(it.adreca || '(sense adreça)') + '</div>' +
    '<div class="rc">' + escHtml(it.rc) + '</div>' + textCadastre(i, 'cor') +
    '<table>' +
    '<tr><td><span class="pin pin-red"></span>Excel</td><td>' + it.xe.toFixed(2) + '</td><td>' + it.ye.toFixed(2) + '</td></tr>' +
    '<tr><td>Nova</td><td>' + utm[0].toFixed(2) + '</td><td>' + utm[1].toFixed(2) + '</td></tr>' +
    '</table>' +
    '<div class="org">' + escHtml(textOrigen(e.origen)) + '<br>' +
    'Desplaçament: ' + d.toFixed(1) + ' m<br>' +
    (it.cor ? (e.revisada ? '<b>Validat.</b>' : 'Arrossega-la per corregir-la des d\'on és, o tria:')
            : (e.revisada ? '<b>Validat.</b> Torna-hi a fer clic per desfer-ho.'
                          : 'Fes clic al punt per validar-lo, o arrossega\'l.')) +
    '</div>' + accionsCorregida(i) + avisHtml(i) + '</div>';
}

// LES JA CORREGIDES (lila): un clic NO les valida (no se sabria si volies
// deixar-la on es o tornar-la al Cadastre); obre la fitxa amb les opcions.
// L'usuari: "les liles es podran clicar i que et doni la opcio de revertir a
// les coordenades de la parcel.la o directament moure-la".
function accionsCorregida(i) {
  var it = ITEMS[i], e = estat[i];
  if (!it.cor) { return ''; }
  var op = [];
  if (!(e.revisada && e.origen === 'excel')) { op.push(enllacFitxa('&#10003; Deixa-la on la té l\'Excel', 'deixaCorregida', i)); }
  else { op.push(enllacFitxa('Desfés la validació', 'commutaValidada', i)); }
  if (esNum(it.xc) && !(e.revisada && e.origen === 'parcela')) {
    op.push(enllacFitxa('&#8630; Torna-la al punt de la parcel·la (Cadastre, a ' + escHtml(String(it.dc)) + ' m)', 'tornaParcela', i));
  }
  if (/^facana/.test(it.prec) && !(e.revisada && e.origen === it.prec)) {
    op.push(enllacFitxa('Porta-la al portal del Cadastre', 'portaPortal', i));
  }
  return '<div class="accions">' + op.join('<br>') + '</div>';
}

// Les tres accions de la fitxa d'una corregida. Totes es poden desfer (Ctrl+Z)
// i totes la deixen VALIDADA: es una decisio, i ha d'anar a l'Excel del repas.
function posaCorregida(i, lat, lon, origen) {
  apuntaDesfer(i);
  estat[i] = { lat: lat, lon: lon, origen: origen, revisada: true };
  capes[i].verd.setLatLng([lat, lon]);
  refrescaObert(i);
  desaItem(i);
  actualitzaEstatBarra();
}
function deixaCorregida(i) { posaCorregida(i, ITEMS[i].late, ITEMS[i].lone, 'excel'); }
function tornaParcela(i)   { posaCorregida(i, ITEMS[i].latc, ITEMS[i].lonc, 'parcela'); }
function portaPortal(i)    { posaCorregida(i, ITEMS[i].latf, ITEMS[i].lonf, ITEMS[i].prec); }

// Els enllacos fan la feina DESPRES del clic (setTimeout): l'accio refa la
// fitxa, l'enllac clicat deixa d'existir a mig clic, i el Leaflet el pren per
// un clic al MAPA i tanca la fitxa (mesurat a la prova del navegador).
function enllacFitxa(text, accio, i) {
  return '<a href="#" onclick="setTimeout(function () { ' + accio + '(' + i + '); }, 0); return false;">' + text + '</a>';
}

function avisHtml(i) {
  if (!teAvis(i)) {
    return '<div class="avis-pop">' + enllacFitxa('&#9888; Marca per revisar', 'marcaAvis', i) + '</div>';
  }
  var nota = avisos[ITEMS[i].id].nota;
  return '<div class="avis-pop">&#9888; <b>Per revisar</b>' + (nota ? ': <span class="nota">' + escHtml(nota) + '</span>' : '') + '<br>' +
         enllacFitxa('canvia la nota', 'marcaAvis', i) + ' &middot; ' + enllacFitxa('treu l\'avís', 'treuAvis', i) + '</div>';
}

// LA TARGETA EN PASSAR-HI EL RATOLI (octubre 2026, l'usuari: "si una
// coordenada l'he mogut, al posar-me sobre em digui les dades, perque si tinc
// dubtes i clico em retorna a la posicio original"). Un clic al verd valida o
// DESVALIDA (i desvalidar un punt mogut el torna al portal): per mirar-se'l,
// n'hi ha prou de passar-hi per sobre. Sense botons: nomes es llegeix.
// Si la coordenada de l'Excel ja s'havia corregit (no es al punt del Cadastre).
function textCadastre(i, cls) {
  var it = ITEMS[i];
  if (it.cor) { return '<div class="' + cls + '">Ja corregida: l\'Excel és a ' + escHtml(String(it.dc)) + ' m del punt del Cadastre</div>'; }
  return '';
}

function targetaHtml(i) {
  var it = ITEMS[i], e = estat[i];
  var utm = utmActual(i);
  var d = distanciaUtm(it.xe, it.ye, utm[0], utm[1]);
  var h = '<b>ID ' + escHtml(it.id) + '</b>' + (it.zona ? ' &middot; zona ' + escHtml(it.zona) : '');
  if (it.titular) { h += '<br>' + escHtml(it.titular); }
  if (it.adt) { h += '<br><span class="tt-gris">Titular a: ' + escHtml(it.adt) + '</span>'; }
  if (it.activitat) { h += '<br><span class="tt-gris">' + escHtml(it.activitat) + '</span>'; }
  h += '<br>' + escHtml(it.adreca || '(sense adreça)');
  h += textCadastre(i, 'tt-cor');
  h += '<br><span class="tt-gris">' + escHtml(textOrigen(e.origen)) + ' &middot; ' + d.toFixed(1) + ' m &middot; ' +
       (e.revisada ? 'validat' : 'pendent') + '</span>';
  if (teAvis(i)) {
    var nota = avisos[it.id].nota;
    h += '<br><span class="tt-avis">&#9888; Per revisar' + (nota ? ': ' + escHtml(nota) : '') + '</span>';
  }
  if (it.cor) {
    h += '<br><span class="tt-gris"><i>Un clic obre les opcions: deixar-la, tornar-la al punt de la parcel·la o arrossegar-la.</i></span>';
  } else if (e.revisada && e.origen === 'manual') {
    h += '<br><span class="tt-gris"><i>Un clic el desvalida i el torna al portal (Ctrl+Z ho desfà).</i></span>';
  }
  return h;
}

function refrescaItem(i) {
  var it = ITEMS[i], c = capes[i], e = estat[i];
  var utm = utmActual(i);
  var d = distanciaUtm(it.xe, it.ye, utm[0], utm[1]);
  var html = popupHtml(i);
  c.linia.setLatLngs([[it.late, it.lone], [e.lat, e.lon]]);
  c.verd.setIcon(iconaVerd(i));
  c.verd.setPopupContent(html);
  c.vermell.setPopupContent(html);
  c.verd.setTooltipContent(targetaHtml(i));
  c.vermell.setTooltipContent(targetaHtml(i));
  c.fila.className = classeFila(i);
  c.fila.cells[2].textContent = d.toFixed(1) + ' m';
}

function actualitzaEstatBarra() {
  var n = comptaRevisades();
  var total = Object.keys(llegeixDesat()).length;
  document.getElementById('estat').textContent =
    'Validades ' + n + ' de ' + ITEMS.length + ' en aquest mapa  ·  ' +
    total + ' en total en aquesta base de dades';
  // Es crida despres de CADA canvi, aixi que tambe es el lloc de refrescar els
  // recomptes i el filtre (una activitat validada deixa de ser 'pendent').
  actualitzaComptes();
  aplicaFiltres();
  refrescaZones();
}

// Validar / desfer. Desfer un punt que havies mogut el torna on el Cadastre
// deia, que es l'unica manera de fer marxa enrere sense refer el mapa.
function commutaValidada(i) {
  var it = ITEMS[i], e = estat[i];
  apuntaDesfer(i);
  if (e.revisada) {
    estat[i] = estatInicial(i);
    capes[i].verd.setLatLng([estat[i].lat, estat[i].lon]);
  } else {
    e.revisada = true;
  }
  refrescaItem(i);
  desaItem(i);
  actualitzaEstatBarra();
}

function validaVisibles() {
  var n = 0;
  for (var i = 0; i < ITEMS.length; i++) {
    if (capes[i].fila.style.display === 'none') { continue; }
    if (estat[i].revisada) { continue; }
    estat[i].revisada = true;
    refrescaItem(i);
    desaItem(i);
    n++;
  }
  actualitzaEstatBarra();
  alert(n === 0 ? 'Ja les tenies totes validades.' : 'Validades ' + n + ' activitats.');
}

var tbody = document.getElementById('tbody');

function pinta() {
  carregaCorreccions();
  muntaZones();
  for (var i = 0; i < ITEMS.length; i++) {
    (function (idx) {
      var it = ITEMS[idx], e = estat[idx];
      var html = popupHtml(idx);

      // Línia fina entre la coordenada de l'Excel i la nova, perquè es vegi
      // quin verd correspon a quin vermell.
      var linia = L.polyline([[it.late, it.lone], [e.lat, e.lon]],
        { color: '#888', weight: 1, opacity: .8, dashArray: '3,4', interactive: false }).addTo(map);

      // Vermell: la coordenada que hi ha ara a l'Excel. NO es pot moure.
      var vermell = L.circleMarker([it.late, it.lone],
        { radius: 5, color: voraExcel(idx), weight: 1, fillColor: it.cor ? '#8e44ad' : '#c0392b', fillOpacity: .95 })
        .addTo(map).bindPopup(html);

      // JA CORREGIDA: linia de punts fins al punt de la parcel.la al Cadastre,
      // i el punt (l'usuari: "que quedi ben clar quines s'han modificat
      // respecte les coordenades del Cadastre").
      var liniaCad = null, puntCad = null;
      if (it.cor && it.latc !== null && it.lonc !== null) {
        liniaCad = L.polyline([[it.late, it.lone], [it.latc, it.lonc]],
          { color: '#555', weight: 1.2, opacity: .8, dashArray: '1,4', lineCap: 'round', interactive: false }).addTo(map);
        puntCad = L.circleMarker([it.latc, it.lonc],
          { radius: 3, color: '#555', weight: 1, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(map);
      }

      // Verd: la coordenada de façana. Aquest sí que es pot arrossegar, i per
      // això ha de ser un L.marker (els circleMarker no són arrossegables).
      var verd = L.marker([e.lat, e.lon], { draggable: true, icon: iconaVerd(idx) })
        .addTo(map).bindPopup(html);
      // La targeta en passar-hi el ratoli (targetaHtml), al verd i al vermell.
      verd.bindTooltip(targetaHtml(idx), { direction: 'top', offset: [0, -10], className: 'targeta' });
      vermell.bindTooltip(targetaHtml(idx), { direction: 'top', offset: [0, -6], className: 'targeta' });

      // Abans de moure'l, es guarda com era: es el que torna «Desfer». Al
      // dragstart NOMES aixo: seleccionar-lo canvia la icona (setIcon), i el
      // Leaflet, en canviar la icona, refa l'arrossegador i talla el drag.
      var abansDrag = null;
      verd.on('dragstart', function () { abansDrag = copiaEstat(estat[idx]); });
      verd.on('dragend', function () {
        if (abansDrag) { pilaDesfer.push({ i: idx, abans: abansDrag }); abansDrag = null; actualitzaBotoDesfer(); }
        var p = verd.getLatLng();
        estat[idx] = { lat: p.lat, lon: p.lng, origen: 'manual', revisada: true };
        selecciona(idx);
        refrescaItem(idx);
        desaItem(idx);
        actualitzaEstatBarra();
      });
      // Un clic al punt el valida (o desfà la validació). Leaflet dispara
      // 'click' després d'un arrossegament curt, així que ens assegurem que no
      // ve d'un drag mirant si la posició ha canviat.
      // Una JA CORREGIDA no: el clic nomes obre la fitxa (accionsCorregida).
      verd.on('click', function () { selecciona(idx); if (!ITEMS[idx].cor) { commutaValidada(idx); } });
      vermell.on('click', function () { selecciona(idx); });

      var fila = document.createElement('tr');
      var utm = utmActual(idx);
      fila.innerHTML =
        '<td class="id">' + escHtml(it.id) + '</td>' +
        '<td>' + escHtml(it.adreca || '—') + (it.titular ? '<div class="tit">' + escHtml(it.titular) + '</div>' : '') + '</td>' +
        '<td class="dist">' + distanciaUtm(it.xe, it.ye, utm[0], utm[1]).toFixed(1) + ' m</td>';
      fila.className = classeFila(idx);
      fila.addEventListener('click', function () { vesA(idx); });
      tbody.appendChild(fila);

      capes[idx] = { verd: verd, vermell: vermell, linia: linia, fila: fila, alMapa: true, liniaCad: liniaCad, puntCad: puntCad };
      bounds.push([it.late, it.lone]);
      bounds.push([e.lat, e.lon]);
    })(i);
  }

  muntaPortals();

  if (bounds.length > 0) { map.fitBounds(L.latLngBounds(bounds).pad(0.08)); }
  else { map.setView([41.355, 2.073], 14); }
  if (TRIA) { posaModeTria(modeTria); }
  actualitzaEstatBarra();
  if (FILTRE_INICIAL && FILTRE_INICIAL !== 'tots') {
    document.getElementById('filtreEstat').value = FILTRE_INICIAL;
    aplicaFiltres();
  }
}

function voraExcel(i) { return ITEMS[i].cor ? '#5b2c6f' : '#8e2b21'; }

// ---------------------------------------------------------------------------
// ELS NUMEROS DELS PORTALS (com al planol del Cadastre)
// ---------------------------------------------------------------------------
// Son TOTS els portals de les parcel.les consultades, tambe els que no tenen
// cap activitat: sense ells no hi ha manera de dir si un punt esta ben posat.
// Nomes surten a partir del zoom de carrer, perque de lluny una illa amb vint
// numeros tapa el mapa.
var ZOOM_NUMS = 18;
var capaPortals = L.layerGroup();

function muntaPortals() {
  for (var i = 0; i < PORTALS.length; i++) {
    var p = PORTALS[i];
    var etiqueta = (p.n || '?') + (p.v ? '' : '');
    capaPortals.addLayer(L.marker([p.lat, p.lon], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: '', iconSize: [0, 0], iconAnchor: [0, 6],
                        html: '<div class="portal-num"><i></i>' + escHtml(etiqueta) + '</div>' })
    }));
  }
  map.on('zoomend', refrescaPortals);
  document.getElementById('chkNums').addEventListener('change', refrescaPortals);
  refrescaPortals();
}

function refrescaPortals() {
  var vol = document.getElementById('chkNums').checked && map.getZoom() >= ZOOM_NUMS;
  if (vol && !map.hasLayer(capaPortals)) { map.addLayer(capaPortals); }
  else if (!vol && map.hasLayer(capaPortals)) { map.removeLayer(capaPortals); }
}

// ---------------------------------------------------------------------------
// TRIAR LES ZONES AL PLANOL (octubre 2026, l'usuari: "a l'hora de triar les
// parcel.les, que te les deixi seleccionar al planol"). El mapa porta TOTES les
// zones de l'abast i la graella de 400 m (la mateixa de la finestra: TRIA porta
// l'origen i la mida de Get-ZonaDeCoord) es clica per triar-les. Nomes es veuen
// les activitats de les zones triades; la tria es recorda al navegador.
//
// El clic es mira des del MAPA (a quina zona cau) i no des del poligon: els
// punts es dibuixen en un canvas que cobreix tot el mapa i es menjaria el clic
// d'un poligon que hi hagues a sota. Per la mateixa rao, mentre tries zones
// els punts no hi son: un clic sempre vol dir "aquesta zona".
// ---------------------------------------------------------------------------
var CLAU_ZONES = 'coordenades-zones:' + FONT;
var zonesActives = {};
var zonesMapa = {};          // nom -> { pol, etq, items: [posicions] }
var modeTria = false;
var capaZones = L.layerGroup();
var ctlTria = null;

// El nom de la zona, igual que Get-ZonaDeCoord/_CoordLletraFila (Coordenades.ps1):
// lletra per la fila (de sud a nord, passada la Z, AA...) i numero per la columna.
function zonaNomJs(col, fil) {
  var lletres = '';
  if (fil < 0) { lletres = 'z' + (-fil); }
  else { var n = fil; do { lletres = String.fromCharCode(65 + (n % 26)) + lletres; n = Math.floor(n / 26) - 1; } while (n >= 0); }
  return lletres + (col + 1);
}
function zonaDeUtm(x, y) {
  var col = Math.floor((x - TRIA.x0) / TRIA.m), fil = Math.floor((y - TRIA.y0) / TRIA.m);
  return { nom: zonaNomJs(col, fil), col: col, fil: fil };
}

function llegeixZones() {
  try { var o = JSON.parse(window.localStorage.getItem(CLAU_ZONES) || '{}'); return (o && typeof o === 'object') ? o : {}; }
  catch (e) { return {}; }
}
function escriuZones() {
  try { window.localStorage.setItem(CLAU_ZONES, JSON.stringify(zonesActives)); } catch (e) { }
}

function muntaZones() {
  if (!TRIA) { return; }
  for (var i = 0; i < ITEMS.length; i++) {
    var nom = ITEMS[i].zona;
    if (!zonesMapa[nom]) {
      var g = zonaDeUtm(ITEMS[i].xe, ITEMS[i].ye);
      var x = TRIA.x0 + g.col * TRIA.m, y = TRIA.y0 + g.fil * TRIA.m, m = TRIA.m;
      // La graella es en UTM: en graus no es un rectangle exacte, per aixo
      // els quatre vertexs i no uns limits.
      var cant = [[x, y], [x + m, y], [x + m, y + m], [x, y + m]].map(function (c) { return utm31ToLatLon(c[0], c[1]); });
      var mig = utm31ToLatLon(x + m / 2, y + m / 2);
      var pol = L.polygon(cant, { interactive: false, weight: 1, color: '#14365c' });
      var etq = L.marker(mig, { interactive: false, keyboard: false,
                                icon: L.divIcon({ className: '', iconSize: [0, 0], iconAnchor: [0, 0], html: '' }) });
      zonesMapa[nom] = { pol: pol, etq: etq, items: [] };
      capaZones.addLayer(pol); capaZones.addLayer(etq);
    }
    zonesMapa[nom].items.push(i);
  }
  // Les marcades a la llista de la finestra manen; si no n'hi havia cap, les
  // de l'ultima vegada (si encara hi son).
  var ini = TRIA.inicials || [];
  zonesActives = {};
  if (ini.length > 0) { ini.forEach(function (n) { if (zonesMapa[n]) { zonesActives[n] = true; } }); escriuZones(); }
  else { var d = llegeixZones(); Object.keys(d).forEach(function (n) { if (zonesMapa[n]) { zonesActives[n] = true; } }); }
  modeTria = Object.keys(zonesActives).length === 0;
  document.getElementById('btnZones').style.display = '';
  map.on('click', clicZona);
}

function resumZones() {
  var nz = 0, na = 0;
  Object.keys(zonesActives).forEach(function (n) { if (zonesMapa[n]) { nz++; na += zonesMapa[n].items.length; } });
  return { zones: nz, acts: na };
}

function refrescaZones() {
  if (!TRIA) { return; }
  Object.keys(zonesMapa).forEach(function (nom) {
    var z = zonesMapa[nom], on = !!zonesActives[nom];
    var pend = 0;
    for (var k = 0; k < z.items.length; k++) { if (!estat[z.items[k]].revisada) { pend++; } }
    z.pol.setStyle(on ? { color: '#14365c', weight: 2.5, dashArray: null, fillColor: '#2e86de', fillOpacity: .28 }
                      : { color: '#5d6d7e', weight: 1, dashArray: '4,4', fillColor: '#aab7b8', fillOpacity: .10 });
    z.etq.setIcon(L.divIcon({ className: '', iconSize: [0, 0], iconAnchor: [0, 0],
      html: '<div class="zona-etq' + (on ? ' activa' : '') + '"><b>' + escHtml(nom) + '</b><br>' + z.items.length + ' act.' +
            (pend < z.items.length ? ' &middot; ' + pend + ' pend.' : '') + '</div>' }));
  });
  if (ctlTria && ctlTria.getContainer()) {
    var r = resumZones();
    ctlTria.getContainer().querySelector('.res').textContent = r.zones + ' zones triades · ' + r.acts + ' activitats';
  }
}

function clicZona(ev) {
  if (!modeTria) { return; }
  var u = latLonToUtm31(ev.latlng.lat, ev.latlng.lng);
  var nom = zonaDeUtm(u[0], u[1]).nom;
  if (!zonesMapa[nom]) { return; }   // una zona sense cap activitat
  if (zonesActives[nom]) { delete zonesActives[nom]; } else { zonesActives[nom] = true; }
  escriuZones();
  refrescaZones();
}

// Entrar a triar (la graella, sense punts) o tornar a la feina (els punts de
// les zones triades, i el mapa s'hi enquadra).
function posaModeTria(on) {
  modeTria = on;
  if (on) {
    map.addLayer(capaZones);
    if (!ctlTria) {
      ctlTria = L.control({ position: 'topright' });
      ctlTria.onAdd = function () {
        var d = L.DomUtil.create('div');
        d.id = 'triaCtl';
        d.innerHTML = '<b>Clica les zones que vols repassar</b> (un altre clic la treu).<br>' +
                      '<span class="res"></span><br><button onclick="commutaModeTria()">Fet</button>';
        L.DomEvent.disableClickPropagation(d);
        return d;
      };
    }
    ctlTria.addTo(map);
  } else {
    map.removeLayer(capaZones);
    if (ctlTria) { ctlTria.remove(); }
    var b = [];
    Object.keys(zonesActives).forEach(function (n) {
      if (!zonesMapa[n]) { return; }
      zonesMapa[n].items.forEach(function (k) { b.push([ITEMS[k].late, ITEMS[k].lone]); b.push([estat[k].lat, estat[k].lon]); });
    });
    if (b.length > 0) { map.fitBounds(L.latLngBounds(b).pad(0.08)); }
  }
  document.getElementById('btnZones').textContent = on ? 'Fet' : 'Triar zones';
  actualitzaEstatBarra();
}

function commutaModeTria() {
  if (modeTria && resumZones().zones === 0) { alert('Encara no has triat cap zona: clica-les al mapa.'); return; }
  posaModeTria(!modeTria);
}

// ---------------------------------------------------------------------------
// FILTRES: el text (ID, adreça o zona) i l'ESTAT (el color del punt, pendents,
// validades). Amaguen la fila I els punts del mapa: «Validar tot el que es veu»
// valida exactament el que queda a la vista.
// ---------------------------------------------------------------------------
var FILTRES = [
  ['tots',           'Totes'],
  ['pendents',       'Pendents de validar'],
  ['cadastre',       'Sense portal (blanc)'],
  ['facana-dubtosa', 'Portal dubtós (groc)'],
  ['facana-aprox',   'Portal més proper (verd clar)'],
  ['facana',         'Portal exacte (verd)'],
  ['manual',         'Mogudes per tu (taronja)'],
  ['validades',      'Validades'],
  ['avis',           'Per revisar (\u26A0)'],
  ['corregides',     'Ja corregides a l\'Excel (lila)']
];

// El color del punt: d'on surt, o 'manual' si l'has mogut.
function categoria(i) { return estat[i].origen; }

function passaEstat(i, f) {
  if (f === 'tots')      { return true; }
  if (f === 'pendents')  { return !estat[i].revisada; }
  if (f === 'validades') { return !!estat[i].revisada; }
  if (f === 'avis')      { return teAvis(i); }
  if (f === 'corregides') { return !!ITEMS[i].cor; }
  return categoria(i) === f;
}

function passaText(i, q) {
  if (q === '') { return true; }
  var it = ITEMS[i];
  return String(it.id).toLowerCase().indexOf(q) >= 0 ||
         String(it.adreca || '').toLowerCase().indexOf(q) >= 0 ||
         String(it.titular || '').toLowerCase().indexOf(q) >= 0 ||
         String(it.zona || '').toLowerCase() === q;
}

function passaFiltres(i) {
  if (TRIA && (modeTria || !zonesActives[ITEMS[i].zona])) { return false; }
  var q = document.getElementById('cerca').value.trim().toLowerCase();
  return passaText(i, q) && passaEstat(i, document.getElementById('filtreEstat').value);
}

// La SELECCIONADA es queda a la vista encara que ja no passi el filtre: si
// filtres per pendents i en valides una, no ha de desapareixer de sota el
// ratoli abans no l'hagis vist. Marxa quan en selecciones una altra.
function aplicaFiltres() {
  for (var i = 0; i < capes.length; i++) {
    var c = capes[i];
    var vol = (i === sel && !modeTria) || passaFiltres(i);
    c.fila.style.display = vol ? '' : 'none';
    if (vol === c.alMapa) { continue; }
    var capesPunt = [c.linia, c.vermell, c.verd];
    if (c.liniaCad) { capesPunt.push(c.liniaCad, c.puntCad); }
    for (var k = 0; k < capesPunt.length; k++) {
      if (vol) { capesPunt[k].addTo(map); } else { map.removeLayer(capesPunt[k]); }
    }
    c.alMapa = vol;
  }
}

function actualitzaComptes() {
  var n = { tots: estat.length, pendents: 0, validades: 0, facana: 0,
            'facana-dubtosa': 0, 'facana-aprox': 0, cadastre: 0, manual: 0, avis: 0, corregides: 0 };
  for (var i = 0; i < estat.length; i++) {
    // Al planol amb zones, nomes compten les de les zones triades.
    if (TRIA && !zonesActives[ITEMS[i].zona]) { n.tots--; continue; }
    if (estat[i].revisada) { n.validades++; } else { n.pendents++; }
    if (teAvis(i)) { n.avis++; }
    if (ITEMS[i].cor) { n.corregides++; }
    var cat = categoria(i);
    if (n.hasOwnProperty(cat)) { n[cat]++; }
  }
  var desp = document.getElementById('filtreEstat');
  if (desp.options.length === 0) {
    for (var f = 0; f < FILTRES.length; f++) { desp.add(new Option('', FILTRES[f][0])); }
  }
  for (var o = 0; o < FILTRES.length; o++) {
    desp.options[o].text = 'Mostra: ' + FILTRES[o][1] + ' (' + n[FILTRES[o][0]] + ')';
  }
  function fila(pin, text, k) {
    return '<span class="pin ' + pin + '"></span> ' + text +
           (k ? ' <span class="n">' + n[k] + '</span>' : '') + '<br>';
  }
  document.getElementById('llegenda').innerHTML =
    fila('pin-red', 'coordenada actual de l\'Excel (fixa)', '') +
    fila('pin-cor', 'JA CORREGIDA: l\'Excel ja no és al punt del Cadastre. Es mou des d\'on és; clica-la per tornar-la a la parcel·la', 'corregides') +
    fila('pin-pcad', 'punt de la parcel·la al Cadastre (línia de punts fins a la lila)', '') +
    fila('pin-fac', 'portal amb el número exacte', 'facana') +
    fila('pin-dub', 'portal dubtós: mira\'l', 'facana-dubtosa') +
    fila('pin-apr', 'el portal més proper de la parcel·la', 'facana-aprox') +
    fila('pin-cad', 'sense portal: comença sobre el vermell', 'cadastre') +
    fila('pin-man', 'mogut per tu', 'manual') +
    fila('pin-rev', 'validat', 'validades') +
    fila('pin-avis', 'per revisar (marca\'l des de la fitxa del punt)', 'avis') +
    '<span class="tecles">Clic al punt verd = validar &middot; arrossega\'l si no és al lloc<br>' +
    'Tecles: <b>N</b> següent pendent &middot; <b>Ctrl+Z</b> desfer</span>';
}

document.getElementById('cerca').addEventListener('input', aplicaFiltres);
document.getElementById('filtreEstat').addEventListener('change', aplicaFiltres);

// ---------------------------------------------------------------------------
// LA PARELLA SELECCIONADA: quan n'hi ha moltes juntes, cal veure d'una ullada
// quin vermell va amb quin verd. Es ressalten la fila, el verd, el vermell i la
// linia que els uneix (que passa de puntejada i grisa a contínua i blava).
// ---------------------------------------------------------------------------
var sel = -1;

function pintaSeleccio(i, on) {
  var c = capes[i];
  c.linia.setStyle(on ? { color: '#14365c', weight: 3, opacity: 1, dashArray: null }
                      : { color: '#888', weight: 1, opacity: .8, dashArray: '3,4' });
  c.vermell.setStyle(on ? { color: '#14365c', weight: 3 } : { color: voraExcel(i), weight: 1 });
  c.vermell.setRadius(on ? 8 : 5);
  c.verd.setZIndexOffset(on ? 1000 : 0);
  if (on && c.alMapa !== false) { c.linia.bringToFront(); c.vermell.bringToFront(); }
  refrescaItem(i);
}

function selecciona(i) {
  if (i === sel) { return; }
  var ant = sel;
  sel = i;
  if (ant >= 0) { pintaSeleccio(ant, false); }
  if (i >= 0)   { pintaSeleccio(i, true); }
  aplicaFiltres();
}

// Centra el mapa en una activitat, la selecciona i n'obre la fitxa.
function vesA(i) {
  selecciona(i);
  // Com a minim el 19, pero sense allunyar si ja eres mes a prop.
  map.setView([estat[i].lat, estat[i].lon], Math.max(map.getZoom(), 19));
  capes[i].verd.openPopup();
  capes[i].fila.scrollIntoView({ block: 'nearest' });
}

// ---------------------------------------------------------------------------
// SEGÜENT PENDENT: la pendent MÉS PROPERA a la que tens seleccionada (o al
// centre del mapa, si no n'hi ha cap), entre les que passen el filtre. Per
// proximitat i no per l'ordre de la llista: aixi es repassa un edifici sencer
// abans de saltar al seguent, en lloc d'anar d'una punta a l'altra de la zona.
// Les que ja t'ha ensenyat i has deixat pendents no tornen fins que s'acaben
// les altres: si no, dues apilades sense validar es passarien la pilota.
// ---------------------------------------------------------------------------
var vistesSeguent = {};

function seguentPendent() {
  var ref;
  // La d'on surts tambe compta com a vista, encara que hi hagis arribat amb un
  // clic: si no, des de la seguent (a 0 m, al mateix edifici) s'hi tornaria.
  if (sel >= 0) { vistesSeguent[sel] = true; ref = [ITEMS[sel].xe, ITEMS[sel].ye]; }
  else { var cm = map.getCenter(); ref = latLonToUtm31(cm.lat, cm.lng); }
  for (var ronda = 0; ronda < 2; ronda++) {
    var millor = -1, dMillor = Infinity;
    for (var i = 0; i < ITEMS.length; i++) {
      if (i === sel || estat[i].revisada || vistesSeguent[i] || !passaFiltres(i)) { continue; }
      var d = distanciaUtm(ref[0], ref[1], ITEMS[i].xe, ITEMS[i].ye);
      if (d < dMillor) { dMillor = d; millor = i; }
    }
    if (millor >= 0) { vistesSeguent[millor] = true; vesA(millor); return; }
    vistesSeguent = {};   // ja les has vistes totes: tornem a comencar
  }
  if (sel >= 0 && !estat[sel].revisada && passaFiltres(sel)) {
    alert('Només queda pendent la que tens seleccionada.'); return;
  }
  alert('No queda cap activitat pendent' +
        (document.getElementById('filtreEstat').value !== 'tots' ||
         document.getElementById('cerca').value.trim() !== '' ? ' amb aquest filtre.' : '.'));
}

// ---------------------------------------------------------------------------
// DESFER: torna un punt com era abans de l'ultim canvi (arrossegar-lo, o el clic
// que el valida o el desvalida -- desvalidar un punt mogut el torna al Cadastre
// i, sense aixo, la posicio que li havies donat es perdia). Es pot desfer fins
// a l'inici de la sessio. La pila viu a la pagina: tancar-la la buida, pero el
// repas en si (el localStorage) no es toca.
// ---------------------------------------------------------------------------
var pilaDesfer = [];

function copiaEstat(e) { return { lat: e.lat, lon: e.lon, origen: e.origen, revisada: e.revisada }; }

function apuntaDesfer(i) { pilaDesfer.push({ i: i, abans: copiaEstat(estat[i]) }); actualitzaBotoDesfer(); }

function actualitzaBotoDesfer() { document.getElementById('btnDesfer').disabled = pilaDesfer.length === 0; }

function desferUltim() {
  var u = pilaDesfer.pop();
  actualitzaBotoDesfer();
  if (!u) { return; }
  estat[u.i] = copiaEstat(u.abans);
  capes[u.i].verd.setLatLng([u.abans.lat, u.abans.lon]);
  refrescaItem(u.i);
  desaItem(u.i);
  selecciona(u.i);
  map.panTo([u.abans.lat, u.abans.lon]);
  actualitzaEstatBarra();
}

// Les tecles, pero no mentre s'escriu al cercador (alla Ctrl+Z desfa el text).
document.addEventListener('keydown', function (ev) {
  var t = ev.target && ev.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') { return; }
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === 'z' || ev.key === 'Z')) {
    ev.preventDefault(); desferUltim(); return;
  }
  if (!ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.key === 'n' || ev.key === 'N')) {
    ev.preventDefault(); seguentPendent();
  }
});

// ---------------------------------------------------------------------------
// BAIXAR L'EXCEL
// ---------------------------------------------------------------------------
// Hi surt TOT el que hagis validat d'aquesta base de dades, encara que sigui
// d'una altra zona i d'un altre dia: la idea es acabar amb UN sol fitxer.
// Quan actualitzis l'Excel d'activitats i en generis un de nou, aixo es buida
// sol, perque la clau del navegador es el nom del fitxer d'origen.
function esNum(v) { return typeof v === 'number' && isFinite(v); }

function baixaExcel() {
  var desat = llegeixDesat();
  var av = llegeixAvisos();
  // Les validades i les marcades per revisar (una pot ser totes dues coses).
  var ids = Object.keys(desat);
  Object.keys(av).forEach(function (k) { if (!desat[k]) { ids.push(k); } });
  if (ids.length === 0) {
    alert('Encara no has validat ni marcat per revisar cap activitat.\n\nAmplia el mapa, comprova els punts i fes-hi clic per validar-los (o arrossega\'ls). Després torna a provar.');
    return;
  }
  var header = CAPCALERA;
  var rows = [];
  for (var k = 0; k < ids.length; k++) {
    var id = ids[k], d = desat[id] || av[id], a = av[id];
    // Nomes per revisar: sense coordenada nova ni origen (no s'ha validat).
    var validada = !!desat[id];
    // typeof i no isFinite a pel: isFinite(null) es CERT (null -> 0), i un
    // repas carregat d'un Excel sense la coordenada vella hi porta null.
    var xe = esNum(d.xe) ? d.xe : '';
    var ye = esNum(d.ye) ? d.ye : '';
    var x = validada && esNum(d.x) ? d.x : '';
    var y = validada && esNum(d.y) ? d.y : '';
    var desp = '';
    if (validada && esNum(d.xe) && esNum(d.ye) && esNum(d.x) && esNum(d.y)) { desp = Math.round(distanciaUtm(d.xe, d.ye, d.x, d.y) * 10) / 10; }
    rows.push([String(id), String(d.rc || ''), String(d.adreca || ''), String(d.zona || ''),
               xe, ye, x, y, validada ? textOrigen(d.origen || 'manual') : '', desp, FONT,
               a ? (a.nota || AVIS_SENSE_NOTA) : '']);
  }
  rows.sort(function (a, b) { return (a[3] + '').localeCompare(b[3] + '') || (a[0] - b[0]); });

  var bytes = buildXlsx('Coordenades', header, rows);
  var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var ara = new Date();
  function dosX(n) { return (n < 10 ? '0' : '') + n; }
  a.href = url;
  a.download = 'Coordenades_' + ara.getFullYear() + dosX(ara.getMonth() + 1) + dosX(ara.getDate()) +
               '_' + dosX(ara.getHours()) + dosX(ara.getMinutes()) + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
}

// ---------------------------------------------------------------------------
// CARREGAR UN REPAS des de l'Excel que et vas baixar. Es la copia de seguretat:
// el repas viu al navegador, i esborrar-ne les dades o canviar d'ordinador el
// perdria. L'Excel es UN SOL FITXER per a tot: la copia, i el que fa servir el
// programa per preparar l'Excel per importar.
//
// El que JA ES AL NAVEGADOR GUANYA: el fitxer es una copia, i pot ser d'abans.
// Si carregar-lo trepitges el navegador, carregar una copia vella desfaria
// sense avisar la feina feta des d'aleshores. Del fitxer nomes s'afegeix el
// que el navegador no te.
// ---------------------------------------------------------------------------
var CAPCALERA = ['ID GIA', 'Ref. cadastral', 'Adreça', 'Zona',
                 'UTM X (Excel)', 'UTM Y (Excel)', 'UTM X (nova)', 'UTM Y (nova)',
                 'Origen', 'Desplaçament (m)', 'Base de dades', 'Per revisar'];
// A la columna «Per revisar», la nota; si l'avis no en porta, aixo.
var AVIS_SENSE_NOTA = 'Sí';

function numeroDe(v) {
  if (typeof v === 'number') { return v; }
  if (v === undefined || v === null || String(v).trim() === '') { return NaN; }
  return parseFloat(String(v).trim().replace(',', '.'));
}

function origenDeText(t) {
  var codis = ['facana', 'facana-dubtosa', 'facana-aprox', 'cadastre', 'manual', 'excel', 'parcela'];
  for (var k = 0; k < codis.length; k++) { if (textOrigen(codis[k]) === t) { return codis[k]; } }
  return 'manual';   // desconegut: la coordenada nova es la del fitxer, i prou
}

function aplicaRepas(files) {
  var cap = (files[0] || []).map(function (h) { return String(h === undefined ? '' : h).trim(); });
  function col(nom) { return cap.indexOf(nom); }
  function cel(f, nom) { var c = col(nom); return c < 0 || f[c] === undefined ? '' : f[c]; }
  if (col('ID GIA') < 0 || col('UTM X (nova)') < 0 || col('UTM Y (nova)') < 0) {
    throw new Error('no és un repàs d\'aquest mapa: hi falten les columnes «ID GIA», «UTM X (nova)» i «UTM Y (nova)»');
  }
  var desat = llegeixDesat();
  var av = llegeixAvisos();
  var res = { noves: 0, jaHiEren: 0, altraBase: 0, invalides: 0, bases: [], avisos: 0 };
  for (var i = 1; i < files.length; i++) {
    var f = files[i] || [];
    var id = String(cel(f, 'ID GIA')).trim();   // 101 (numero, si l'Excel l'ha convertit) -> '101'
    if (id === '') { continue; }
    // Els fitxers d'abans d'aquesta columna no la porten: llavors no es pot dir
    // i es carreguen. Si la porten, nomes els d'aquesta base.
    var base = String(cel(f, 'Base de dades')).trim();
    if (base !== '' && base !== FONT) {
      res.altraBase++;
      if (res.bases.indexOf(base) < 0) { res.bases.push(base); }
      continue;
    }
    // L'avis «per revisar» (com les coordenades: el del navegador guanya).
    var pr = String(cel(f, 'Per revisar')).trim();
    if (pr !== '' && !av[id]) {
      var xa = numeroDe(cel(f, 'UTM X (Excel)')), ya = numeroDe(cel(f, 'UTM Y (Excel)'));
      av[id] = { nota: pr === AVIS_SENSE_NOTA ? '' : pr, rc: String(cel(f, 'Ref. cadastral')), adreca: String(cel(f, 'Adreça')),
                 zona: String(cel(f, 'Zona')), xe: isFinite(xa) ? xa : null, ye: isFinite(ya) ? ya : null };
      res.avisos++;
    }
    var x = numeroDe(cel(f, 'UTM X (nova)')), y = numeroDe(cel(f, 'UTM Y (nova)'));
    // Una fila NOMES per revisar no porta coordenada nova, i no es cap error.
    if (!isFinite(x) || !isFinite(y)) { if (pr === '') { res.invalides++; } continue; }
    if (desat[id]) { res.jaHiEren++; continue; }
    var ll = utm31ToLatLon(x, y);
    var xe = numeroDe(cel(f, 'UTM X (Excel)')), ye = numeroDe(cel(f, 'UTM Y (Excel)'));
    desat[id] = {
      lat: ll[0], lon: ll[1], origen: origenDeText(String(cel(f, 'Origen'))),
      x: r2(x), y: r2(y), xe: isFinite(xe) ? xe : null, ye: isFinite(ye) ? ye : null,
      rc: String(cel(f, 'Ref. cadastral')), adreca: String(cel(f, 'Adreça')), zona: String(cel(f, 'Zona'))
    };
    res.noves++;
  }
  escriuDesat(desat);
  escriuAvisos(av);
  return res;
}

// Torna a pintar tots els punts amb el que hi ha ara al navegador.
function repintaTot() {
  carregaCorreccions();
  for (var i = 0; i < ITEMS.length; i++) {
    capes[i].verd.setLatLng([estat[i].lat, estat[i].lon]);
    refrescaItem(i);
  }
  actualitzaEstatBarra();
}

function carregaRepas(fitxer) {
  return fitxer.arrayBuffer().then(llegeixXlsx).then(function (files) {
    var r = aplicaRepas(files);
    repintaTot();
    var msg = r.noves === 0 && r.jaHiEren === 0 && r.altraBase === 0 && r.avisos === 0
      ? 'El fitxer no porta cap activitat repassada.'
      : 'Recuperades ' + r.noves + ' activitats del fitxer.';
    if (r.avisos > 0) { msg += '\n' + r.avisos + ' avisos «per revisar» recuperats.'; }
    if (r.jaHiEren > 0) { msg += '\n' + r.jaHiEren + ' ja eren al navegador: es queda la del navegador, que és la més nova.'; }
    if (r.altraBase > 0) {
      msg += '\n' + r.altraBase + ' són d\'una altra base de dades (' + r.bases.join(', ') + ') i no s\'han carregat.' +
             '\nAquest mapa és de: ' + FONT;
    }
    if (r.invalides > 0) { msg += '\n' + r.invalides + ' files sense coordenada nova vàlida s\'han saltat.'; }
    alert(msg);
    return r;
  }).catch(function (e) {
    alert('No s\'ha pogut carregar el repàs: ' + (e && e.message ? e.message : e));
  });
}

document.getElementById('fitxerRepas').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) { return; }
  carregaRepas(f).then(function () { ev.target.value = ''; });   // per poder tornar a triar el mateix
});

function esborraCorreccions() {
  var total = Object.keys(llegeixDesat()).length;
  var nAvis = Object.keys(llegeixAvisos()).length;
  if (total === 0 && nAvis === 0) { alert('Encara no has validat res.'); return; }
  if (!confirm('Segur que vols descartar el repàs sencer d\'aquesta base de dades?\n\nSón ' + total + ' activitats validades' +
               (nAvis > 0 ? ' i ' + nAvis + ' marcades per revisar' : '') + ', també les d\'altres zones i altres dies.')) { return; }
  try { window.localStorage.removeItem(CLAU); window.localStorage.removeItem(CLAU_AVIS); } catch (e) { }
  avisos = {};
  pilaDesfer = [];
  actualitzaBotoDesfer();
  for (var i = 0; i < ITEMS.length; i++) {
    estat[i] = estatInicial(i);
    capes[i].verd.setLatLng([estat[i].lat, estat[i].lon]);
    refrescaItem(i);
  }
  actualitzaEstatBarra();
}

pinta();
</script>
